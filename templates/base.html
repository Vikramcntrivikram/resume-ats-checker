<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume ATS Score Checker - By Vikram TRIVIKRAM</title>
    <link href="https://cdn.replit.com/agent/bootstrap-dark-theme-link" rel="stylesheet">
    <style>
        body {
            padding-top: 5rem;
            padding-bottom: 5rem;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 800px;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 1.2rem;
        }
        .developer-tag {
            background-color: #3498db;
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
        }
        .btn-primary {
            background-color: #3498db;
            border-color: #3498db;
        }
        .btn-primary:hover {
            background-color: #2980b9;
            border-color: #2980b9;
        }
        .score-display {
            font-size: 4rem;
            font-weight: bold;
            text-align: center;
            margin: 1rem 0;
        }
        .score-excellent { color: #27ae60; }
        .score-good { color: #f39c12; }
        .score-needs-work { color: #e74c3c; }
        .list-item {
            margin-bottom: 0.5rem;
            padding-left: 1.5rem;
            position: relative;
        }
        .list-item:before {
            content: "•";
            position: absolute;
            left: 0;
            color: #3498db;
        }
        .footer {
            text-align: center;
            margin-top: 3rem;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <div class="logo">Resume ATS Checker</div>
                <div class="developer-tag">By Vikram TRIVIKRAM</div>
            </a>
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-warning alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Vikram TRIVIKRAM. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
